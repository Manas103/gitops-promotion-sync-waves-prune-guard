{{- if .Values.enableWorkload }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Values.serviceName }}, labels: {app: {{ .Values.serviceName }}, owner: {{ .Values.owner }}}, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Values.serviceName }}}}
  template:
    metadata: {labels: {app: {{ .Values.serviceName }}}}
    spec:
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ .Values.image }}
{{- end }}
