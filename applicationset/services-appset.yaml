apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: cluster-a
                - cluster: cluster-b
                - cluster: cluster-c
          - list:
              elements:
                - {service: svc1, owner: team-checkout}
                - {service: svc2, owner: team-payments}
                - {service: svc3, owner: team-risk}
                - {service: svc4, owner: team-settlement}
                - {service: svc5, owner: team-reporting}
                - {service: svc6, owner: team-reference-data}
  template:
    metadata:
      name: "{{cluster}}-{{service}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Manas103/gitops-promotion-sync-waves-prune-guard.git
        targetRevision: master
        path: service-template
        helm:
          parameters:
            - {name: serviceName, value: "{{service}}"}
            - {name: clusterName, value: "{{cluster}}"}
            - {name: owner, value: "{{owner}}"}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{cluster}}-{{service}}"
      syncPolicy:
        syncOptions: ["CreateNamespace=true"]
